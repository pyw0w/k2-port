name: Auto Release

on:
  push:
    branches: [main]
    paths: [info.json]
  workflow_dispatch:

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get current version
        id: current
        run: |
          VERSION=$(jq -r '.version' info.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Get previous version
        id: previous
        run: |
          VERSION=$(git show HEAD~1:info.json 2>/dev/null | jq -r '.version' || echo "none")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Previous version: $VERSION"

      - name: Check if version changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Manual trigger - forcing release"
          elif [ "${{ steps.current.outputs.version }}" != "${{ steps.previous.outputs.version }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed: ${{ steps.previous.outputs.version }} -> ${{ steps.current.outputs.version }}"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged"
          fi

      - name: Check if tag exists
        id: tag_exists
        if: steps.changed.outputs.changed == 'true'
        run: |
          if git rev-parse "v${{ steps.current.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create mod archive
        if: steps.changed.outputs.changed == 'true' && steps.tag_exists.outputs.exists == 'false'
        run: |
          MOD_NAME="k2-port"
          VERSION="${{ steps.current.outputs.version }}"
          ARCHIVE_NAME="${MOD_NAME}_${VERSION}.zip"

          mkdir -p /tmp/${MOD_NAME}

          rsync -av \
            --exclude='.agents/' \
            --exclude='.github/' \
            --exclude='.git/' \
            --exclude='.gitignore' \
            --exclude='docs/' \
            --exclude='*.md' \
            --exclude='*.zip' \
            --exclude='_upstream/' \
            . /tmp/${MOD_NAME}/

          cd /tmp
          zip -r ${ARCHIVE_NAME} ${MOD_NAME}/
          mv ${ARCHIVE_NAME} ${GITHUB_WORKSPACE}/
          rm -rf /tmp/${MOD_NAME}

      - name: Create tag and release
        if: steps.changed.outputs.changed == 'true' && steps.tag_exists.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.changed.outputs.changed == 'true' && steps.tag_exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.current.outputs.version }}
          name: v${{ steps.current.outputs.version }}
          files: k2-port_${{ steps.current.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
